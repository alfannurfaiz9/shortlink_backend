basePath: /
definitions:
  dto.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.Login:
    properties:
      email:
        example: yourname@mail.com
        type: string
      password:
        example: password
        type: string
    type: object
  dto.Register:
    properties:
      email:
        example: yourname@mail.com
        type: string
      full_name:
        example: your name
        type: string
      password:
        example: password
        minLength: 6
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  dto.Response:
    properties:
      message:
        type: string
      result: {}
      success:
        type: boolean
    type: object
host: localhost:9000
info:
  contact: {}
  description: API docs for shortlink
  title: Shortlink Backend
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user
      parameters:
      - description: body to login
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      description: Create new user
      parameters:
      - description: body to register
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
        "406":
          description: Not Acceptable
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Create new user
      tags:
      - auth
securityDefinitions:
  BearerToken:
    description: Bearer Token used as identity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
